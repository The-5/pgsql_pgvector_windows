
name: Build pgvector 0.8.7 for PostgreSQL 18 x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      # 1. 检出当前仓库
      - name: Checkout workflow repository
        uses: actions/checkout@v7

      # 2. 下载 pgvector 官方源码
      - name: Checkout official pgvector source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'pgvector'

          git clone `
            --depth 1 `
            --branch v0.8.7 `
            https://github.com/pgvector/pgvector.git `
            $source

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to clone official pgvector v0.8.7 source.'
          }

          $commit = (git -C $source rev-parse HEAD).Trim()
          Write-Host "pgvector source commit: $commit"

          "PGVECTOR_SRC=$source" >> $env:GITHUB_ENV

      # 3. 下载并校验 EDB 官方 PostgreSQL 18 x64 二进制压缩包
      - name: Download PostgreSQL 18 binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archive = Join-Path $env:RUNNER_TEMP `
            'postgresql-18.6-5-windows-x64-binaries.zip'

          $url = 'https://get.enterprisedb.com/postgresql/postgresql-18.6-5-windows-x64-binaries.zip'

          $expectedHash = 'e2246ba91d22345bc3d017586c09ede52d9df180b1eeb480f050445f1cad84e2'

          Invoke-WebRequest -Uri $url -OutFile $archive

          $actualHash = (
            Get-FileHash $archive -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($actualHash -ne $expectedHash) {
            throw "PostgreSQL ZIP SHA-256 mismatch: $actualHash"
          }

          Write-Host 'PostgreSQL ZIP SHA-256 verified.'

          $extract = Join-Path $env:RUNNER_TEMP 'postgresql-binaries'

          Expand-Archive `
            -LiteralPath $archive `
            -DestinationPath $extract `
            -Force

          $pgRoot = Join-Path $extract 'pgsql'

          $requiredFiles = @(
            "$pgRoot\bin\pg_config.exe"
            "$pgRoot\bin\initdb.exe"
            "$pgRoot\bin\pg_ctl.exe"
            "$pgRoot\bin\psql.exe"
            "$pgRoot\include\server\postgres.h"
            "$pgRoot\lib\postgres.lib"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required PostgreSQL file is missing: $file"
            }
          }

          $version = (& "$pgRoot\bin\pg_config.exe" --version).Trim()

          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^PostgreSQL 18\.') {
            throw "Unexpected PostgreSQL version: $version"
          }

          Write-Host "Build target: $version"

          $dataDir = Join-Path $env:RUNNER_TEMP 'pgvector-test-data'

          $envLines = @(
            "PGROOT=$pgRoot"
            "PGDATA=$dataDir"
            'PGHOST=127.0.0.1'
            'PGPORT=55432'
            'PGUSER=postgres'
            'PGDATABASE=postgres'
          )

          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            (($envLines -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )

          [System.IO.File]::AppendAllText(
            $env:GITHUB_PATH,
            "$pgRoot\bin`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      # 4. 使用 GitHub Runner 自带的 MSVC x64 编译 pgvector
      - name: Build and install pgvector
        shell: cmd
        working-directory: pgvector
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1

          echo PGROOT=%PGROOT%

          if not exist "%PGROOT%\include\server\postgres.h" exit /b 1

          nmake /NOLOGO /F Makefile.win
          if errorlevel 1 exit /b 1

          nmake /NOLOGO /F Makefile.win install
          if errorlevel 1 exit /b 1

          if not exist "%PGROOT%\lib\vector.dll" exit /b 1
          if not exist "%PGROOT%\share\extension\vector.control" exit /b 1

          echo pgvector build and installation succeeded.

      # 5. 初始化临时测试数据库
      - name: Initialize PostgreSQL test database
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $initdb = Join-Path $env:PGROOT 'bin\initdb.exe'

          & $initdb `
            -D $env:PGDATA `
            -U postgres `
            --auth=trust `
            --no-locale `
            -E UTF8

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            throw "initdb failed with exit code $exitCode"
          }

      # 6. 启动临时 PostgreSQL 服务
      - name: Start PostgreSQL test server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $pgCtl = Join-Path $env:PGROOT 'bin\pg_ctl.exe'
          $log = Join-Path $env:RUNNER_TEMP 'postgres-test.log'

          & $pgCtl `
            -D $env:PGDATA `
            -l $log `
            -o "-h 127.0.0.1 -p $env:PGPORT" `
            -w start

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            if (Test-Path $log) {
              Get-Content $log -Tail 100
            }

            throw "PostgreSQL startup failed with exit code $exitCode"
          }

          & (Join-Path $env:PGROOT 'bin\psql.exe') `
            -X `
            -v ON_ERROR_STOP=1 `
            -h $env:PGHOST `
            -p $env:PGPORT `
            -U postgres `
            -d postgres `
            -c 'SELECT version();'

          if ($LASTEXITCODE -ne 0) {
            throw 'PostgreSQL connection test failed.'
          }

      # 7. 测试扩展、向量运算和 HNSW 索引
      - name: Test pgvector functionality
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sqlPath = Join-Path $env:RUNNER_TEMP 'pgvector-smoke-test.sql'
          $log = Join-Path $env:RUNNER_TEMP 'postgres-test.log'

          $sql = @'
          CREATE EXTENSION vector;

          CREATE TABLE pgvector_ci_smoke (
            id integer PRIMARY KEY,
            embedding vector(3) NOT NULL
          );

          INSERT INTO pgvector_ci_smoke (id, embedding)
          VALUES
            (1, '[1,2,3]'),
            (2, '[4,5,6]');

          CREATE INDEX pgvector_ci_smoke_hnsw
          ON pgvector_ci_smoke
          USING hnsw (embedding vector_l2_ops);

          DO $$
          DECLARE
            nearest_id integer;
          BEGIN
            SELECT id INTO nearest_id
            FROM pgvector_ci_smoke
            ORDER BY embedding <-> '[3,1,2]'::vector
            LIMIT 1;

            IF nearest_id IS DISTINCT FROM 1 THEN
              RAISE EXCEPTION 'Nearest-neighbor test failed';
            END IF;
          END
          $$;

          SELECT extversion
          FROM pg_extension
          WHERE extname = 'vector';

          SELECT indexname
          FROM pg_indexes
          WHERE tablename = 'pgvector_ci_smoke'
            AND indexname = 'pgvector_ci_smoke_hnsw';
          '@

          [System.IO.File]::WriteAllText(
            $sqlPath,
            $sql,
            [System.Text.UTF8Encoding]::new($false)
          )

          & (Join-Path $env:PGROOT 'bin\psql.exe') `
            -X `
            -v ON_ERROR_STOP=1 `
            -h $env:PGHOST `
            -p $env:PGPORT `
            -U postgres `
            -d postgres `
            -f $sqlPath

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            if (Test-Path $log) {
              Get-Content $log -Tail 100
            }

            throw "pgvector smoke test failed with exit code $exitCode"
          }

      # 8. 停止临时数据库
      - name: Stop PostgreSQL test server
        if: always()
        shell: pwsh
        run: |
          if (
            $env:PGROOT -and
            $env:PGDATA -and
            (Test-Path "$env:PGROOT\bin\pg_ctl.exe") -and
            (Test-Path $env:PGDATA)
          ) {
            & "$env:PGROOT\bin\pg_ctl.exe" `
              -D $env:PGDATA `
              -m fast `
              -w stop

            if ($LASTEXITCODE -ne 0) {
              Write-Host 'PostgreSQL was not running or could not be stopped.'
            }
          }

      # 9. 打包可安装的扩展文件和校验信息
      - name: Package pgvector artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = Join-Path $env:RUNNER_TEMP 'pgvector-dist'
          $libDir = Join-Path $dist 'lib'
          $extDir = Join-Path $dist 'share\extension'

          New-Item -ItemType Directory -Force -Path `
            $libDir, $extDir | Out-Null

          Copy-Item `
            "$env:PGROOT\lib\vector.dll" `
            $libDir `
            -Force

          Copy-Item `
            "$env:PGROOT\share\extension\vector.control" `
            $extDir `
            -Force

          $sqlFiles = @(
            Get-ChildItem `
              "$env:PGROOT\share\extension" `
              -Filter 'vector*.sql' `
              -File
          )

          if ($sqlFiles.Count -eq 0) {
            throw 'No pgvector SQL files were found.'
          }

          $sqlFiles | Copy-Item -Destination $extDir -Force

          $sourceCommit = (
            git -C $env:PGVECTOR_SRC rev-parse HEAD
          ).Trim()

          $pgVersion = (
            & "$env:PGROOT\bin\pg_config.exe" --version
          ).Trim()

          $dllHash = (
            Get-FileHash "$libDir\vector.dll" -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $buildInfo = @"
          pgvector version: 0.8.7
          Source repository: https://github.com/pgvector/pgvector
          Source tag: v0.8.7
          Source commit: $sourceCommit
          PostgreSQL target: $pgVersion
          Target platform: Windows x64
          Compiler: MSVC x64 on GitHub Actions windows-2025
          vector.dll SHA-256: $dllHash
          "@

          [System.IO.File]::WriteAllText(
            (Join-Path $dist 'BUILD-INFO.txt'),
            $buildInfo,
            [System.Text.UTF8Encoding]::new($false)
          )

          $readme = @'
          pgvector 0.8.7 - PostgreSQL 18 Windows x64

          This artifact contains the PostgreSQL extension files only.
          It does not contain a complete PostgreSQL installation.

          Installation:
          1. Back up your database.
          2. Stop the target PostgreSQL 18 service.
          3. Copy the contents of this artifact into the PostgreSQL
             installation root, preserving the directory structure.
          4. Restart PostgreSQL.
          5. In each database requiring pgvector, execute:

             CREATE EXTENSION vector;

          For an existing older extension, inspect the current version
          and available upgrade scripts before upgrading.

          This build was tested against the EDB PostgreSQL 18 Windows
          x64 binary distribution used by this workflow. Validate it
          against the exact PostgreSQL installation used in production.
          '@

          [System.IO.File]::WriteAllText(
            (Join-Path $dist 'README-INSTALL.txt'),
            $readme,
            [System.Text.UTF8Encoding]::new($false)
          )

          $hashLines = foreach (
            $file in Get-ChildItem $dist -Recurse -File |
              Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          ) {
            $hash = (
              Get-FileHash $file.FullName -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            $relative = $file.FullName.Substring(
              $dist.Length
            ).TrimStart('\').Replace('\', '/')

            "$hash  $relative"
          }

          [System.IO.File]::WriteAllLines(
            (Join-Path $dist 'SHA256SUMS.txt'),
            [string[]]$hashLines,
            [System.Text.UTF8Encoding]::new($false)
          )

          Get-ChildItem $dist -Recurse -File |
            Select-Object FullName, Length

      # 10. 上传 Artifact
      - name: Upload pgvector artifact
        uses: actions/upload-artifact@v7
        with:
          name: pgvector-0.8.7-pg18-windows-x64
          path: ${{ runner.temp }}/pgvector-dist/
          if-no-files-found: error
          retention-days: 14
